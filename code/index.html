<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>찰싹 결정</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&display=swap');
    :root { color-scheme: light; --ink: #183b32; --forest: #245444; --moss: #89a778; --cream: #fbf5df; --paper: #f3e9c9; --carrot: #df7040; --sun: #f0c667; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #39291f; }
    body { display: grid; place-items: center; font-family: "Cabinet Grotesk", Pretendard, system-ui, sans-serif; background: radial-gradient(ellipse at 50% 15%, #826a4d 0, #39291f 68%); }
    #game { position: relative; width: min(100vw, 430px); height: 100dvh; max-height: 900px; overflow: hidden; border-inline: 7px solid #e4d3a7; background: var(--cream); box-shadow: -14px 0 0 #294d3e, 14px 0 0 #6f4b32, 0 24px 90px #170e09aa; isolation: isolate; }
    #game::after { position: absolute; inset: 0; z-index: 1; pointer-events: none; content: ""; opacity: .2; background-image: radial-gradient(#183b3222 .7px, transparent .7px); background-size: 5px 5px; mix-blend-mode: multiply; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; inset: max(14px, env(safe-area-inset-top)) 14px auto; z-index: 3; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 11px 12px 11px 17px; border: 1px solid #193d32; border-radius: 5px 14px 5px 14px; pointer-events: none; color: var(--ink); background: #fff8dfeb; box-shadow: 4px 5px 0 #294d3e30; backdrop-filter: blur(8px); font-weight: 800; }
    #hud > span:first-child { font-family: Georgia, "Noto Serif KR", serif; letter-spacing: -.045em; }
    #status { padding: 6px 9px; border-radius: 3px 8px 3px 8px; color: var(--cream); background: var(--forest); font-size: 12px; letter-spacing: .02em; }
    #race-timer { grid-column: 1 / -1; font: 900 22px/1 monospace; letter-spacing: -.05em; text-align: right; }
    #guide { position: absolute; z-index: 3; left: 50%; bottom: max(46px, calc(env(safe-area-inset-bottom) + 24px)); transform: translateX(-50%); width: max-content; max-width: 88%; padding: 14px 20px 16px; border: 1px solid #17392f; border-radius: 4px 14px 4px 14px; color: var(--cream); background: var(--forest); box-shadow: 5px 6px 0 #df7040, 0 14px 30px #183b3238; font: 800 15px/1.35 inherit; cursor: pointer; transition: transform .25s ease, background .25s ease; }
    #guide:active { transform: translateX(-50%) scale(.97); }
    button, input, select { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .player-label { position: absolute; z-index: 3; transform: translate(-50%, -100%) rotate(-1deg); padding: 5px 9px; border: 1px solid #183b3266; border-radius: 3px 8px 3px 8px; color: var(--ink); background: #fff8dfeb; font-family: Georgia, "Noto Serif KR", serif; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 2px 3px 0 #df704033; pointer-events: none; }
    #error { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; padding: 28px; color: var(--cream); background: var(--ink); text-align: center; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; z-index: 5; display: grid; align-items: end; padding: 82px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden; background: linear-gradient(180deg, #173b3008 8%, #173b30bb 72%, #102820ed); }
    .card { position: relative; width: 100%; padding: 24px 22px 22px; overflow: hidden; border: 1px solid #6e5a3f; border-radius: 5px 24px 8px 18px; color: var(--ink); background: linear-gradient(100deg, #e7d7ab 0 9px, #fffaf0 10px 100%); box-shadow: 5px 7px 0 #d4bd86, 10px 13px 0 #294d3e99, 0 28px 70px #071b1573; }
    .card::before { position: absolute; inset: 10px; border: 1px solid #7c684344; border-radius: 2px 15px 3px 11px; pointer-events: none; content: ""; }
    .card::after { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; clip-path: polygon(100% 0, 0 100%, 100% 100%); background: #d9c69a; box-shadow: -2px -2px 0 #7c684355; content: ""; }
    .card > * { position: relative; z-index: 1; }
    .story-marquee { margin: -24px -22px 18px; overflow: hidden; border-bottom: 1px solid #593824; color: #fff8df; background: #b85734; font-family: Georgia, "Noto Serif KR", serif; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .story-marquee-track { display: flex; width: max-content; padding: 8px 0; }
    .story-marquee-track span { width: max-content; padding-right: 24px; }
    .hero-title { max-width: 22rem; margin: 0 0 10px; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(28px, 8vw, 37px); line-height: 1.04; letter-spacing: -.065em; text-decoration: underline 3px #df704066; text-underline-offset: 7px; }
    .hero-title span { display: block; }
    .hero-title img { display: inline-block; width: 54px; height: 30px; margin-left: 5px; border-radius: 999px; object-fit: cover; object-position: 50% 28%; vertical-align: middle; filter: saturate(.75) contrast(1.08); }
    .card h2 { max-width: 19rem; margin: 0 0 8px; font-family: Georgia, "Noto Serif KR", serif; font-size: 30px; line-height: 1.06; letter-spacing: -.055em; }
    .card > p { margin: 0 0 18px; color: #4f6b60; line-height: 1.45; }
    .turtle-mark { position: absolute; top: 58px; right: -18px; width: 80px; height: 58px; opacity: .18; transform: rotate(-12deg); }
    .turtle-mark::before { position: absolute; inset: 9px 18px 5px 4px; border: 4px double var(--forest); border-radius: 50%; content: ""; }
    .turtle-mark::after { position: absolute; top: 19px; right: 5px; width: 18px; height: 16px; border-radius: 50%; background: var(--forest); box-shadow: -49px -15px 0 -4px var(--forest), -49px 22px 0 -4px var(--forest), -16px -16px 0 -4px var(--forest), -16px 23px 0 -4px var(--forest); content: ""; }
    .secondary { min-width: 0; padding: 11px; border: 1px solid #5f503b; border-radius: 3px 10px 3px 10px; color: var(--ink); background: #fff8e7; box-shadow: 2px 3px 0 #d8c59a; font-weight: 800; transition: transform .25s ease, background .25s ease; }
    #name-fields { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: dense; gap: 1px; overflow: hidden; border: 1px solid #5f503b; border-radius: 3px 12px 3px 12px; background: #5f503b; box-shadow: 3px 4px 0 #d8c59a; }
    .participant { min-width: 0; display: grid; background: #fffbd5; }
    #name-fields input, #name-fields select { min-width: 0; width: 100%; border: 0; border-radius: 0; color: var(--ink); background: #fffbd5; outline: none; }
    #name-fields input { padding: 12px 11px 7px; }
    #name-fields select { display: none; }
    .mini-character-picker { height: 106px; display: grid; grid-template-columns: 28px 1fr 28px; align-items: center; gap: 2px; padding: 4px; border-top: 2px solid var(--ink); background: var(--paper); }
    .mini-character-picker button { width: 28px; height: 42px; padding: 0; border: 2px solid var(--ink); border-radius: 5px; color: var(--cream); background: var(--carrot); box-shadow: 2px 2px 0 var(--ink); font-size: 20px; }
    .mini-character-preview { min-width: 0; height: 96px; display: grid; place-items: center; grid-template-rows: 74px 18px; font-size: 12px; }
    .mini-character-preview img { width: 100%; height: 74px; object-fit: contain; }
    .mini-character-picker[aria-disabled="true"] { opacity: .35; }
    #name-fields select option:disabled { color: #aaa; }
    #name-fields input:focus { position: relative; z-index: 1; box-shadow: inset 0 0 0 2px var(--carrot); }
    #decision-question { display: none; width: 100%; margin-bottom: 9px; padding: 13px 14px; border: 3px solid var(--forest); border-radius: 15px; color: var(--ink); background: #dff6ff; outline: none; box-shadow: 0 4px 0 #1f603c; }
    #game[data-mode="choice"] #decision-question { display: block; }
    #game[data-mode="choice"] .card { background: #eaf9df; }
    #game[data-mode="choice"] #name-fields { border-color: #2489a7; background: #2489a7; box-shadow-color: #17687f; }
    #race-start { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; background: #163b2db8; backdrop-filter: blur(2px); }
    #race-start[hidden] { display: none; }
    .start-board { min-width: 230px; padding: 22px 26px 26px; border: 5px solid #fffbd5; border-radius: 28px; background: #22543d; box-shadow: 0 10px 0 #123425, 0 28px 70px #06150f99; text-align: center; }
    .signal-lights { display: flex; justify-content: center; gap: 13px; margin-bottom: 10px; }
    .signal-lights i { width: 38px; height: 38px; border: 4px solid #123425; border-radius: 50%; background: #17372d; box-shadow: inset 0 -5px 0 #0004; }
    .signal-lights i.on { background: #ffd83d; box-shadow: 0 0 24px #ffd83d, inset 0 -5px 0 #d78d13; }
    .signal-lights i.go { background: #72ed6c; box-shadow: 0 0 30px #72ed6c, inset 0 -5px 0 #2b9f42; }
    #start-count { color: #fffbd5; font-size: 86px; font-weight: 950; line-height: .95; text-shadow: 0 7px 0 #10291f; }
    #start-caption { margin-top: 8px; color: #fff3a7; font-size: 14px; font-weight: 850; letter-spacing: .13em; }
    .settings { display: flex; gap: 18px; margin: 14px 2px; color: #4f6b60; font-size: 13px; font-weight: 700; }
    .settings input { accent-color: var(--forest); }
    .primary { width: 100%; padding: 14px; border: 1px solid #17392f; border-radius: 4px 14px 4px 14px; color: var(--cream); background: var(--forest); box-shadow: 4px 5px 0 #df7040; font-weight: 850; transition: transform .25s ease, background .25s ease; }
    .primary:active, .secondary:active { transform: scale(.97); }
    .feedback-carousel { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin: 14px 0; border-block: 1px dashed #6e5a3f88; }
    .feedback-carousel button { height: 44px; border: 0; color: var(--ink); background: transparent; font-size: 18px; }
    #result-copy { min-height: 58px; margin: 0; padding: 10px 8px; display: grid; place-items: center; color: #4f6b60; text-align: center; line-height: 1.4; }
    .result-character { display: grid; grid-template-columns: 112px 1fr; align-items: center; gap: 12px; margin: 14px 0; }
    #result-character-image { width: 112px; height: 112px; object-fit: contain; }
    #result-speech { position: relative; margin: 0; padding: 16px 14px; border: 3px solid var(--ink); border-radius: 16px; background: #fff; box-shadow: 4px 4px 0 var(--ink); font-size: 18px; line-height: 1.35; white-space: pre-line; }
    #result-speech::before { position: absolute; top: 43px; left: -12px; width: 18px; height: 18px; border-bottom: 3px solid var(--ink); border-left: 3px solid var(--ink); background: #fff; content: ""; transform: rotate(45deg); }
    #result-list { margin: 14px 0 18px; padding: 0; list-style: none; display: grid; }
    #result-list li { margin-top: -1px; padding: 11px 13px; border: 1px solid #6e5a3f55; background: #fff8df; font-family: Georgia, "Noto Serif KR", serif; font-weight: 700; box-shadow: 2px 3px 0 #d8c59a; }
    #result-list li:nth-child(even) { transform: rotate(.4deg); }
    #result-list li:first-child { position: relative; z-index: 2; color: var(--cream); background: var(--carrot); transform: rotate(-.5deg); }
    .actions { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
    .actions button { width: 100%; }
    :root { --ink: #202020; --forest: #16804c; --cream: #fffceb; --paper: #ffe66a; --carrot: #ff5b45; --sun: #ffd83d; }
    html, body { background: #ffdf43; }
    body { font-family: "Jua", "Arial Rounded MT Bold", Pretendard, system-ui, sans-serif; background-color: #ffdf43; background-image: linear-gradient(90deg, #ffffff55 50%, transparent 50%), linear-gradient(#ffffff55 50%, transparent 50%); background-size: 28px 28px; }
    #game { border: 4px solid var(--ink); background: #67ddeb; box-shadow: 9px 9px 0 #1671d9; }
    #game::after { display: none; }
    #hud { border: 3px solid var(--ink); border-radius: 7px; background: var(--paper); box-shadow: 4px 4px 0 var(--ink); backdrop-filter: none; transform: rotate(-.5deg); }
    #hud > span:first-child { font-family: inherit; letter-spacing: 0; }
    #status { border: 2px solid var(--ink); border-radius: 999px; background: var(--carrot); transform: rotate(3deg); }
    #guide { border: 3px solid var(--ink); border-radius: 8px; background: var(--carrot); box-shadow: 5px 5px 0 var(--ink); transform: translateX(-50%) rotate(-1deg); }
    #guide:active { transform: translateX(-50%) rotate(-1deg) translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .player-label { border: 2px solid var(--ink); border-radius: 5px; background: var(--paper); box-shadow: 2px 2px 0 var(--ink); font-family: inherit; }
    .overlay { background: #16804c99; }
    #setup { display: block; padding: 0; overflow-x: hidden; overflow-y: auto; background: var(--cream); }
    .setup-page { position: relative; width: 100%; min-height: 100%; display: flex; flex-direction: column; padding: max(22px, env(safe-area-inset-top)) 22px max(22px, env(safe-area-inset-bottom)); color: var(--ink); background: var(--cream); }
    .setup-page > p { margin: 0 0 18px; color: #4f6b60; line-height: 1.45; }
    .setup-page .story-marquee { margin: calc(-1 * max(22px, env(safe-area-inset-top))) -22px 22px; }
    .setup-page .settings { margin-top: auto; }
    .card { padding: 22px; border: 4px solid var(--ink); border-radius: 9px; background: var(--cream); box-shadow: 8px 8px 0 var(--ink); transform: rotate(.35deg); }
    .card::before, .card::after { display: none; }
    .story-marquee { margin: -22px -22px 18px; border-bottom: 4px solid var(--ink); background: var(--carrot); font-family: inherit; letter-spacing: 0; }
    .hero-title, .card h2 { font-family: inherit; line-height: 1.05; letter-spacing: 0; text-decoration: none; }
    .hero-title img { border: 3px solid var(--ink); border-radius: 4px; background: #67ddeb; filter: saturate(1.2); transform: rotate(5deg); }
    .turtle-mark { opacity: .32; }
    .secondary { border: 3px solid var(--ink); border-radius: 7px; background: var(--paper); box-shadow: 3px 3px 0 var(--ink); }
    #name-fields { gap: 3px; border: 3px solid var(--ink); border-radius: 7px; background: var(--ink); box-shadow: 4px 4px 0 var(--ink); }
    #name-fields input { background: var(--cream); }
    .settings { color: var(--ink); }
    .primary { border: 3px solid var(--ink); border-radius: 7px; background: var(--carrot); box-shadow: 4px 4px 0 var(--ink); }
    .feedback-carousel { border-block: 3px dashed var(--ink); }
    #result-list li { border: 3px solid var(--ink); background: var(--paper); box-shadow: 3px 3px 0 var(--ink); font-family: inherit; }
    #result-list li:first-child { background: var(--carrot); }
    #decision-question { border-color: var(--ink); border-radius: 7px; box-shadow: 4px 4px 0 var(--ink); }
    .start-board { border-color: var(--ink); border-radius: 9px; background: #1671d9; box-shadow: 7px 7px 0 var(--ink); transform: rotate(-1deg); }
    .signal-lights i { border-color: var(--ink); }
    @media (hover: hover) { button:hover { filter: brightness(1.08); } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main id="game" data-mode="choice" aria-label="찰싹 결정 선택 도우미">
    <div id="hud"><span>찰싹 결정</span><span id="status">준비</span><span id="race-timer">00:00.00</span></div>
    <button id="guide" type="button">선택 결과 확인하기</button>
    <div id="race-start" aria-live="assertive" hidden><div class="start-board"><div class="signal-lights" aria-hidden="true"><i></i><i></i><i></i></div><div id="start-count">3</div><div id="start-caption">선택 준비</div></div></div>
    <div id="error">서비스를 불러오지 못했어요.<br />화면을 새로고침해 주세요.</div>
    <section id="setup" class="overlay" aria-labelledby="setup-title">
      <form id="setup-form" class="setup-page">
        <div class="story-marquee" aria-hidden="true"><div class="story-marquee-track"><span>고민될 땐 하나만 찰싹</span><span>선택이 필요할 때 가볍게 결정</span><span>고민될 땐 하나만 찰싹</span><span>선택이 필요할 때 가볍게 결정</span></div></div>
        <div class="turtle-mark" aria-hidden="true"></div>
        <h1 id="setup-title" class="hero-title"><span>고민은 가볍게</span><span>하나는 찰싹 선택 <img src="./assets/characters/rabbit.png" alt="" /></span></h1>
        <p id="setup-description">고민되는 선택지를 적어주세요. 느린 중력이 결말을 정합니다.</p>
        <input id="decision-question" maxlength="30" placeholder="무엇을 결정할까요?" aria-label="결정할 질문" required />
        <div id="name-fields">
          <div class="participant"><input name="name" maxlength="10" placeholder="1번째 선택지" aria-label="1번째 선택지" required /><select name="character" aria-label="첫 번째 캐릭터"></select><div class="mini-character-picker" aria-label="첫 번째 캐릭터 선택"><button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button><div class="mini-character-preview"><img alt="" /><span>곰</span></div><button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button></div></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="2번째 선택지" aria-label="2번째 선택지" required /><select name="character" aria-label="두 번째 캐릭터"></select><div class="mini-character-picker" aria-label="두 번째 캐릭터 선택"><button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button><div class="mini-character-preview"><img alt="" /><span>토끼</span></div><button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button></div></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="3번째 선택지 (선택)" aria-label="3번째 선택지" /><select name="character" aria-label="세 번째 캐릭터"></select><div class="mini-character-picker" aria-label="세 번째 캐릭터 선택"><button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button><div class="mini-character-preview"><img alt="" /><span>고양이</span></div><button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button></div></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="4번째 선택지 (선택)" aria-label="4번째 선택지" /><select name="character" aria-label="네 번째 캐릭터"></select><div class="mini-character-picker" aria-label="네 번째 캐릭터 선택"><button class="character-step" data-direction="-1" type="button" aria-label="이전 캐릭터">‹</button><div class="mini-character-preview"><img alt="" /><span>오리</span></div><button class="character-step" data-direction="1" type="button" aria-label="다음 캐릭터">›</button></div></div>
        </div>
        <div class="settings">
          <label><input id="sound-toggle" type="checkbox" checked /> 소리</label>
          <label><input id="haptic-toggle" type="checkbox" checked /> 진동</label>
        </div>
        <button id="setup-submit" class="primary" type="submit" disabled>결정 준비 중</button>
      </form>
    </section>
    <section id="result" class="overlay" aria-labelledby="result-title" hidden>
      <div class="card">
        <div class="story-marquee" aria-hidden="true"><div class="story-marquee-track"><span>오늘의 선택</span><span>고민 대신 하나를 골랐어요</span><span>오늘의 선택</span><span>고민 대신 하나를 골랐어요</span></div></div>
        <h2 id="result-title"></h2>
        <div class="result-character">
          <img id="result-character-image" alt="" />
          <p id="result-speech" aria-live="polite"></p>
        </div>
        <div class="feedback-carousel"><button id="comment-prev" type="button" aria-label="이전 한마디">←</button><p id="result-copy" aria-live="polite"></p><button id="comment-next" type="button" aria-label="다음 한마디">→</button></div>
        <ol id="result-list"></ol>
        <div class="actions">
          <button id="edit-players" class="secondary" type="button">선택지 변경</button>
          <button id="replay" class="primary" type="button">다시 결정</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
