<!doctype html>
<!-- Phaser prototype -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>찰싹 레이스 프로토타입</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: #211d2b; overflow: hidden; }
    body { display: grid; place-items: center; font-family: system-ui, sans-serif; }
    #game { width: min(100vw, 430px); height: 100dvh; max-height: 900px; }
    #game canvas { display: block; width: 100% !important; height: 100% !important; }
    #creator { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: #211d2b; }
    .creator-card { width: min(92vw, 390px); padding: 22px; border-radius: 24px; background: #fff8ec; color: #3b3241; text-align: center; }
    .creator-card h1 { margin: 0 0 6px; }
    .creator-card p { margin: 0 0 14px; font-size: 14px; }
    .photo-preview { display: grid; place-items: center; width: 180px; height: 180px; margin: auto; border: 3px dashed #bca9c2; border-radius: 50%; background: #fff; overflow: hidden; }
    .photo-preview canvas { width: 180px; height: 180px; }
    #photo-zoom { width: 180px; }
    #player-name { width: 180px; margin: 0 0 10px; padding: 10px 14px; border: 2px solid #d8cadd; border-radius: 999px; font: inherit; text-align: center; background: #fff; }
    .photo-tools { display: flex; justify-content: center; align-items: center; gap: 10px; margin: 14px 0; }
    .photo-tools button, #start-game { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 800; cursor: pointer; }
    #choose-photo { background: #eadbea; color: #3b3241; }
    #start-game { width: 100%; background: #6f5c75; color: #fff; font-size: 17px; }
  </style>
</head>
<body>
  <section id="creator" aria-label="얼굴 사진 선택">
    <div class="creator-card">
      <h1 id="creator-title">플레이어 1 얼굴 사진 (1/4)</h1>
      <p>사진은 선택 사항이에요. 건너뛰면 기본 얼굴이 들어가요.<br />선택한 사진은 이 기기 브라우저에서만 처리됩니다.</p>
      <input id="player-name" maxlength="8" value="플레이어 1" aria-label="캐릭터 이름" />
      <div class="photo-preview"><canvas id="photo-preview" width="180" height="180"></canvas></div>
      <input id="photo-input" type="file" accept="image/*" capture="user" hidden />
      <div class="photo-tools"><button id="choose-photo" type="button">사진 고르기</button></div>
      <input id="photo-zoom" type="range" min="1" max="3" value="1" step="0.01" aria-label="사진 확대" />
      <p>사진을 드래그해 얼굴 위치를 맞춰주세요.</p>
      <button id="start-game" type="button">다음 캐릭터</button>
    </div>
  </section>
  <main id="game" aria-label="찰싹 레이스 게임"></main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@4.2.0/dist/phaser.js"></script>
  <script>
    const WIDTH = 390;
    const HEIGHT = 844;
    const FLOOR_Y = 1510;
    const START_LINE_Y = 360;
    const BASE_SCALE = 0.8;
    const NAMES = ['플레이어 1', '플레이어 2', '플레이어 3', '플레이어 4'];
    const COLORS = [0x242223, 0xd8d2c8, 0xe8d39a, 0xb97845];
    const MatterBody = Phaser.Physics.Matter.Matter.Body;
    const MatterConstraint = Phaser.Physics.Matter.Matter.Constraint;

    let racers = [];
    let started = false;
    let finished = false;
    let finishCount = 0;
    let guide;
    const photos = [];
    let photoIndex = 0;
    let selectedPhoto;
    let draggingPhoto = false;
    let dragPoint;
    const photoInput = document.querySelector('#photo-input');
    const nameInput = document.querySelector('#player-name');
    const previewCanvas = document.querySelector('#photo-preview');
    const previewContext = previewCanvas.getContext('2d');

    function drawFace(context, photo, size) {
      const { image, zoom = 1, x = 0, y = 0, baseSize = size } = photo;
      const scale = Math.max(size / image.width, size / image.height);
      const width = image.width * scale * zoom;
      const height = image.height * scale * zoom;
      context.clearRect(0, 0, size, size);
      context.save();
      context.beginPath();
      context.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2);
      context.clip();
      context.drawImage(image, (size - width) / 2 + x * size / baseSize, (size - height) / 2 + y * size / baseSize, width, height);
      context.restore();
    }

    function drawDefaultFace(context, size) {
      context.clearRect(0, 0, size, size);
      context.fillStyle = '#fff5df';
      context.beginPath(); context.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); context.fill();
      context.fillStyle = '#403248';
      context.beginPath(); context.ellipse(size * 0.36, size * 0.44, size * 0.06, size * 0.08, 0, 0, Math.PI * 2); context.fill();
      context.beginPath(); context.ellipse(size * 0.64, size * 0.44, size * 0.06, size * 0.08, 0, 0, Math.PI * 2); context.fill();
      context.fillStyle = '#f6a5a5';
      context.beginPath(); context.arc(size * 0.25, size * 0.61, size * 0.1, 0, Math.PI * 2); context.fill();
      context.beginPath(); context.arc(size * 0.75, size * 0.61, size * 0.1, 0, Math.PI * 2); context.fill();
      context.strokeStyle = '#403248'; context.lineWidth = size * 0.05; context.lineCap = 'round';
      context.beginPath(); context.arc(size / 2, size * 0.55, size * 0.13, 0.1, Math.PI - 0.1); context.stroke();
    }

    drawDefaultFace(previewContext, previewCanvas.width);

    document.querySelector('#choose-photo').addEventListener('click', () => photoInput.click());
    document.querySelector('#photo-zoom').addEventListener('input', (event) => {
      if (!selectedPhoto) return;
      selectedPhoto.zoom = Number(event.target.value);
      drawFace(previewContext, selectedPhoto, previewCanvas.width);
    });
    previewCanvas.addEventListener('pointerdown', (event) => {
      if (!selectedPhoto) return;
      draggingPhoto = true;
      dragPoint = { x: event.clientX, y: event.clientY };
      previewCanvas.setPointerCapture(event.pointerId);
    });
    previewCanvas.addEventListener('pointermove', (event) => {
      if (!draggingPhoto) return;
      const ratio = previewCanvas.width / previewCanvas.getBoundingClientRect().width;
      selectedPhoto.x += (event.clientX - dragPoint.x) * ratio;
      selectedPhoto.y += (event.clientY - dragPoint.y) * ratio;
      dragPoint = { x: event.clientX, y: event.clientY };
      drawFace(previewContext, selectedPhoto, previewCanvas.width);
    });
    previewCanvas.addEventListener('pointerup', () => draggingPhoto = false);
    previewCanvas.addEventListener('pointercancel', () => draggingPhoto = false);
    photoInput.addEventListener('change', () => {
      const file = photoInput.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const image = new Image();
        image.onload = () => {
          selectedPhoto = { image, zoom: 1, x: 0, y: 0, baseSize: previewCanvas.width };
          document.querySelector('#photo-zoom').value = '1';
          drawFace(previewContext, selectedPhoto, previewCanvas.width);
        };
        image.src = reader.result;
      };
      reader.readAsDataURL(file);
    });
    document.querySelector('#start-game').addEventListener('click', () => {
      NAMES[photoIndex] = nameInput.value.trim() || NAMES[photoIndex];
      photos.push(selectedPhoto);
      photoIndex += 1;
      selectedPhoto = undefined;
      photoInput.value = '';
      document.querySelector('#photo-zoom').value = '1';
      drawDefaultFace(previewContext, previewCanvas.width);

      if (photoIndex < NAMES.length) {
        document.querySelector('#creator-title').textContent = `${NAMES[photoIndex]} 얼굴 사진 (${photoIndex + 1}/4)`;
        nameInput.value = NAMES[photoIndex];
        if (photoIndex === NAMES.length - 1) document.querySelector('#start-game').textContent = '레이스 시작';
      } else {
        document.querySelector('#creator').remove();
        launchGame();
      }
    });

    function create() {
      photos.forEach((photo, index) => createFaceTexture.call(this, photo, index));
      drawRoom.call(this);

      racers = NAMES.map((name, index) => {
        const x = 58 + index * 91;
        const sprite = createSlime.call(this, x, 150, COLORS[index], index);
        const ragdoll = createRagdoll.call(this, x, 150, index);

        return {
          sprite,
          body: ragdoll.torso,
          ragdoll,
          limbs: sprite.list.slice(0, 4),
          laneX: x,
          startY: 150,
          name,
          label: this.add.text(x, 68, name, {
            fontFamily: 'system-ui, sans-serif', fontSize: '15px', fontStyle: '700', color: '#3b3241'
          }).setOrigin(0.5),
          timer: null,
          collisionTimer: null,
          limbTweens: [],
          anchorMode: 'hands',
          anchorPads: [],
          anchorY: 0,
          anchorConstraints: [],
          done: false
        };
      });

      racers.forEach((racer) => {
        racer.sprite.setSize(62, 94).setInteractive({ useHandCursor: true });
        this.input.setDraggable(racer.sprite);
      });
      this.input.on('drag', (_pointer, sprite, dragX, dragY) => {
        if (started || finished) return;
        const racer = racers.find((player) => player.sprite === sprite);
        if (!racer) return;
        racer.laneX = Phaser.Math.Clamp(dragX, 34, WIDTH - 34);
        racer.startY = Phaser.Math.Clamp(dragY, 105, START_LINE_Y - 48);
        resetRagdoll.call(this, racer, racer.laneX, racer.startY);
        syncRagdoll(racer);
        racer.label.setPosition(racer.laneX, racer.startY - 82);
      });

      guide = this.add.text(WIDTH / 2, 475, '출발선 위 공간에서 캐릭터를 배치한 뒤\n여기를 눌러 찰싹!', {
        fontFamily: 'system-ui, sans-serif', fontSize: '27px', fontStyle: '800', color: '#3b3241',
        backgroundColor: '#fff4b8', padding: { x: 18, y: 12 }
      }).setOrigin(0.5).setScrollFactor(0).setDepth(20).setInteractive({ useHandCursor: true });

      this.cameras.main.setBounds(0, 0, WIDTH, FLOOR_Y + 89);
      this.matter.world.setBounds(0, 0, WIDTH, FLOOR_Y + 89, 32, false, false, false, true);

      guide.on('pointerdown', () => {
        if (!started || finished) startRace.call(this);
      });
    }

    function startRace() {
      started = true;
      finished = false;
      finishCount = 0;
      this.cameras.main.scrollY = 0;

      racers.forEach((racer, index) => {
        racer.timer?.remove(false);
        racer.collisionTimer?.remove(false);
        racer.limbTweens.forEach((tween) => tween.stop());
        removeAnchors.call(this, racer);
        resetRagdoll.call(this, racer, racer.laneX, racer.startY);
        racer.done = false;
        racer.anchorMode = 'hands';
        setRacerCollision(racer, false);
        attachPads.call(this, racer, index % 2 ? [1, 0] : [0, 1]);
        racer.ragdoll.bodies.forEach((body) => MatterBody.setStatic(body, false));
        racer.collisionTimer = this.time.delayedCall(700, () => setRacerCollision(racer, true));
      });

      guide.setVisible(false).disableInteractive();
    }

    function update() {
      racers.forEach((racer) => {
        if (started && !finished && !stabilizeRagdoll(racer)) {
          recoverRacer.call(this, racer);
        }
        syncRagdoll(racer);
        racer.label.setPosition(racer.body.position.x, racer.body.position.y - 82);
        if (started && !finished && !racer.done && racer.body.position.y >= FLOOR_Y - 48) {
          racer.done = true;
          finishCount += 1;
          if (finishCount === 1) finishRace.call(this, racer);
        }
      });
      if (started && !finished) followRaceCamera.call(this);
    }

    function stabilizeRagdoll(racer) {
      if (racer.ragdoll.bodies.some((body) => !Number.isFinite(body.position.x) || !Number.isFinite(body.position.y))) {
        return false;
      }
      racer.ragdoll.bodies.forEach((body) => {
        MatterBody.setVelocity(body, {
          x: Phaser.Math.Clamp(body.velocity.x, -7, 7),
          y: Phaser.Math.Clamp(body.velocity.y, -7, 7)
        });
        MatterBody.setAngularVelocity(body, Phaser.Math.Clamp(body.angularVelocity, -0.16, 0.16));
      });
      return true;
    }

    function recoverRacer(racer) {
      racer.timer?.remove(false);
      racer.collisionTimer?.remove(false);
      removeAnchors.call(this, racer);
      resetRagdoll.call(this, racer, racer.laneX, racer.startY);
      racer.anchorMode = 'hands';
      setRacerCollision(racer, false);
      attachPads.call(this, racer, [0, 1]);
      racer.ragdoll.bodies.forEach((body) => MatterBody.setStatic(body, false));
      racer.collisionTimer = this.time.delayedCall(700, () => setRacerCollision(racer, true));
    }

    function attachPads(racer, padIndices) {
      if (racer.done || finished) return;
      const orderedPads = [...padIndices].sort((first, second) => (
        racer.ragdoll.limbs[second].pad.position.y - racer.ragdoll.limbs[first].pad.position.y
      ));
      racer.anchorPads = orderedPads;
      racer.anchorMode = padIndices[0] < 2 ? 'hands' : 'feet';
      const primaryPad = racer.ragdoll.limbs[orderedPads[0]].pad;
      racer.anchorY = primaryPad.position.y;
      const constraint = MatterConstraint.create({
        pointA: { x: Phaser.Math.Clamp(primaryPad.position.x, 18, WIDTH - 18), y: primaryPad.position.y },
        bodyB: primaryPad,
        length: 1,
        stiffness: 0.58,
        damping: 0.3
      });
      this.matter.world.add(constraint);
      racer.anchorConstraints = [constraint];

      orderedPads.forEach((padIndex, order) => {
        const pad = racer.limbs[padIndex].pad;
        racer.limbTweens.push(this.tweens.add({
          targets: pad,
          scaleX: order === 0 ? 1.4 : 1.16,
          scaleY: order === 0 ? 0.68 : 0.9,
          duration: 100,
          yoyo: true
        }));
      });
      racer.timer = this.time.delayedCall(Phaser.Math.Between(380, 720), () => switchAnchor.call(this, racer));
    }

    function switchAnchor(racer) {
      if (racer.done || finished) return;
      const nextPads = racer.anchorMode === 'hands' ? [2, 3] : [0, 1];
      const nextY = Math.max(...nextPads.map((index) => racer.ragdoll.limbs[index].pad.position.y));
      if (nextY <= racer.anchorY + 8) {
        racer.timer = this.time.delayedCall(90, () => switchAnchor.call(this, racer));
        return;
      }
      const oldAnchors = racer.anchorConstraints;
      attachPads.call(this, racer, nextPads);
      this.time.delayedCall(Phaser.Math.Between(90, 150), () => {
        oldAnchors.forEach((constraint) => this.matter.world.remove(constraint));
      });
    }

    function removeAnchors(racer) {
      racer.anchorConstraints.forEach((constraint) => this.matter.world.remove(constraint));
      racer.anchorConstraints = [];
    }

    function setRacerCollision(racer, enabled) {
      racer.ragdoll.bodies.forEach((body) => {
        body.collisionFilter.mask = enabled ? 0xffffffff : 1;
      });
    }

    function followRaceCamera() {
      const positions = racers.map((racer) => racer.body.position.y).filter(Number.isFinite);
      if (!positions.length) return;
      const leadY = Phaser.Math.Clamp(Math.max(...positions), 0, FLOOR_Y);
      const targetY = Phaser.Math.Clamp(leadY - HEIGHT * 0.56, 0, FLOOR_Y - HEIGHT + 89);
      const cameraStep = Phaser.Math.Clamp(targetY - this.cameras.main.scrollY, -4, 4);
      this.cameras.main.scrollY += cameraStep;
    }

    function finishRace(winner) {
      finished = true;
      racers.forEach((racer) => {
        racer.timer?.remove(false);
        racer.limbTweens.forEach((tween) => tween.stop());
      });
      guide.setVisible(true).setText(`${winner.name} 우승!\n다시 하려면 터치`).setAlign('center').setBackgroundColor('#fff4b8').setInteractive({ useHandCursor: true });
    }

    function createFaceTexture(photo, index) {
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = 64;
      if (photo) drawFace(canvas.getContext('2d'), photo, 64);
      else drawDefaultFace(canvas.getContext('2d'), 64);
      this.textures.addCanvas(`face-${index}`, canvas);
    }

    function createRagdoll(x, y, playerIndex) {
      const group = -(playerIndex + 1);
      const bodyOptions = {
        isStatic: false,
        collisionFilter: { group, category: 1 << (playerIndex + 1), mask: 1 },
        friction: 0.8,
        frictionStatic: 1,
        frictionAir: 0.07,
        restitution: 0.01,
        density: 0.002
      };
      const torso = this.matter.add.rectangle(x, y, 30 * BASE_SCALE, 39 * BASE_SCALE, bodyOptions);
      const head = this.matter.add.circle(x, y - 22 * BASE_SCALE, 20 * BASE_SCALE, bodyOptions);
      const bodies = [torso, head];
      const limbs = [];
      const limbSpecs = [
        [-17, -5, 102, 32], [17, -5, -102, 32],
        [-10, 19, 16, 30], [10, 19, -16, 30]
      ];

      this.matter.add.constraint(torso, head, 0, 0.45, {
          pointA: { x: 0, y: -14 * BASE_SCALE },
          pointB: { x: 0, y: 12 * BASE_SCALE },
        damping: 0.16
      });

      limbSpecs.forEach(([limbX, limbY, angle, length], index) => {
        const upperLength = Math.round(length * 0.48) * BASE_SCALE;
        const lowerLength = (length - Math.round(length * 0.48)) * BASE_SCALE;
        const shoulder = { x: x + limbX * BASE_SCALE, y: y + limbY * BASE_SCALE };
        const elbow = pointAlong(shoulder, angle, upperLength);
        const end = pointAlong(elbow, angle, lowerLength);
        const upperCenter = pointAlong(shoulder, angle, upperLength / 2);
        const lowerCenter = pointAlong(elbow, angle, lowerLength / 2);
        const upper = this.matter.add.rectangle(upperCenter.x, upperCenter.y, 12 * BASE_SCALE, upperLength, bodyOptions);
        const lower = this.matter.add.rectangle(lowerCenter.x, lowerCenter.y, 12 * BASE_SCALE, lowerLength, bodyOptions);
        const pad = this.matter.add.circle(end.x, end.y, (index < 2 ? 9 : 10) * BASE_SCALE, bodyOptions);

        [upper, lower].forEach((body) => MatterBody.setAngle(body, Phaser.Math.DegToRad(angle)));
        this.matter.add.constraint(torso, upper, 0, 0.52, {
          pointA: { x: limbX * BASE_SCALE, y: limbY * BASE_SCALE },
          pointB: { x: 0, y: -upperLength / 2 },
          damping: 0.14
        });
        this.matter.add.constraint(upper, lower, 0, 0.45, {
          pointA: { x: 0, y: upperLength / 2 },
          pointB: { x: 0, y: -lowerLength / 2 },
          damping: 0.14
        });
        this.matter.add.constraint(lower, pad, 0, 0.55, {
          pointA: { x: 0, y: lowerLength / 2 },
          damping: 0.16
        });
        limbs.push({ upper, lower, pad });
        bodies.push(upper, lower, pad);
      });

      const initial = bodies.map((body) => ({ x: body.position.x - x, y: body.position.y - y, angle: body.angle }));
      bodies.forEach((body) => MatterBody.setStatic(body, true));
      return {
        torso,
        head,
        limbs,
        bodies,
        initial
      };
    }

    function pointAlong(point, angle, distance) {
      const radians = Phaser.Math.DegToRad(angle);
      return {
        x: point.x - Math.sin(radians) * distance,
        y: point.y + Math.cos(radians) * distance
      };
    }

    function resetRagdoll(racer, x, y) {
      racer.ragdoll.bodies.forEach((body, index) => {
        const initial = racer.ragdoll.initial[index];
        MatterBody.setStatic(body, true);
        MatterBody.setPosition(body, { x: x + initial.x, y: y + initial.y });
        MatterBody.setAngle(body, initial.angle);
        MatterBody.setVelocity(body, { x: 0, y: 0 });
        MatterBody.setAngularVelocity(body, 0);
      });
    }

    function syncRagdoll(racer) {
      const { torso, head, limbs } = racer.ragdoll;
      racer.sprite.setPosition(torso.position.x, torso.position.y).setRotation(torso.angle).setScale(BASE_SCALE);

      const headWobble = Phaser.Math.Clamp(head.angle - torso.angle, -0.18, 0.18);
      racer.sprite.head.setPosition(0, -21).setRotation(headWobble * 0.35);
      racer.limbs.forEach((limb, index) => {
        const physics = limbs[index];
        limb.setRotation(physics.upper.angle - torso.angle);
        limb.joint.setRotation(physics.lower.angle - physics.upper.angle);
        limb.pad.setRotation(physics.pad.angle - physics.lower.angle);
      });
    }

    function createSlime(x, y, color, playerIndex) {
      const root = this.add.container(x, y);
      const limbSpecs = [
        [-17, -5, 102, 32], [17, -5, -102, 32],
        [-10, 19, 16, 30], [10, 19, -16, 30]
      ];

      limbSpecs.forEach(([limbX, limbY, angle, length], index) => {
        const limb = this.add.container(limbX, limbY).setAngle(angle);
        const upperLength = Math.round(length * 0.48);
        const lowerLength = length - upperLength;
        const joint = this.add.container(0, upperLength);
        limb.homeAngle = angle;
        limb.upperLength = upperLength;
        limb.lowerLength = lowerLength;
        limb.joint = joint;
        joint.homeAngle = 0;
        const pad = this.add.container(0, lowerLength);
        pad.add([
          this.add.ellipse(1, 2, index < 2 ? 21 : 23, 17, 0x000000, 0.12),
          this.add.ellipse(0, 0, index < 2 ? 21 : 23, 17, color),
          this.add.circle(-6, -4, 4, 0xffffff, 0.12),
          this.add.circle(5, 3, 4, 0x000000, 0.06)
        ]);
        limb.pad = pad;
        limb.add([
          this.add.rectangle(1, 2, 15, upperLength + 4, 0x000000, 0.1).setOrigin(0.5, 0),
          this.add.rectangle(0, 0, 15, upperLength + 4, color).setOrigin(0.5, 0),
          this.add.circle(0, 2, 8, color),
          this.add.circle(0, upperLength, 8, color),
          this.add.circle(-4, upperLength * 0.35, 5, 0xffffff, 0.1),
          joint
        ]);
        joint.add([
          this.add.rectangle(1, 0, 15, lowerLength + 5, 0x000000, 0.1).setOrigin(0.5, 0),
          this.add.rectangle(0, -2, 15, lowerLength + 5, color).setOrigin(0.5, 0),
          this.add.circle(0, 0, 8, color),
          this.add.circle(0, lowerLength, 8, color),
          this.add.circle(4, lowerLength * 0.4, 5, 0x000000, 0.05),
          pad
        ]);
        root.add(limb);
      });

      const body = this.add.container(0, 7);
      const head = this.add.container(0, -21);
      body.add([
        this.add.ellipse(2, 3, 47, 51, 0x000000, 0.12),
        this.add.ellipse(0, 0, 47, 51, color),
        this.add.circle(-18, -8, 7, color),
        this.add.circle(18, 5, 7, color),
        this.add.circle(-11, 18, 7, color),
        this.add.circle(10, -18, 6, 0xffffff, 0.1)
      ]);
      if (playerIndex === 0) {
        body.add([
          this.add.rectangle(0, 5, 34, 28, 0xf1eee8),
          this.add.rectangle(-9, 5, 5, 28, 0x343238).setAngle(-38),
          this.add.rectangle(9, 5, 5, 28, 0x343238).setAngle(-38),
          this.add.rectangle(-9, 5, 5, 28, 0x343238).setAngle(38),
          this.add.rectangle(9, 5, 5, 28, 0x343238).setAngle(38)
        ]);
      }
      if (playerIndex === 0) {
        head.add([
          this.add.triangle(-13, -22, -10, 15, 0, -12, 12, 15, color),
          this.add.triangle(13, -22, -10, 15, 0, -12, 12, 15, color)
        ]);
      } else if (playerIndex === 1) {
        head.add([
          this.add.ellipse(-21, -4, 17, 29, color).setAngle(18),
          this.add.ellipse(21, -4, 17, 29, color).setAngle(-18)
        ]);
      } else if (playerIndex === 2) {
        head.add([
          this.add.ellipse(-10, -35, 15, 42, color).setAngle(-7),
          this.add.ellipse(10, -35, 15, 42, color).setAngle(7),
          this.add.ellipse(-10, -36, 6, 28, 0xeeb8a8, 0.55).setAngle(-7),
          this.add.ellipse(10, -36, 6, 28, 0xeeb8a8, 0.55).setAngle(7)
        ]);
      } else {
        head.add([
          this.add.circle(-17, -15, 10, color),
          this.add.circle(17, -15, 10, color)
        ]);
      }
      head.add([
        this.add.ellipse(2, 2, 48, 44, 0x000000, 0.12),
        this.add.ellipse(0, 0, 48, 44, color),
        this.add.circle(-18, 2, 6, color),
        this.add.circle(18, -4, 6, color),
        this.add.circle(-9, -16, 6, 0xffffff, 0.1),
        this.add.image(0, 2, `face-${playerIndex}`).setDisplaySize(27, 27)
      ]);
      if (playerIndex === 1) {
        head.add([
          this.add.ellipse(-9, -14, 18, 12, 0x000000, 0).setStrokeStyle(3, 0x343238),
          this.add.ellipse(9, -14, 18, 12, 0x000000, 0).setStrokeStyle(3, 0x343238),
          this.add.rectangle(0, -14, 5, 3, 0x343238)
        ]);
      }
      if (playerIndex === 3) {
        head.add([
          this.add.circle(-14, -18, 5, 0xe0b53c),
          this.add.circle(-20, -14, 5, 0xe0b53c),
          this.add.circle(-8, -14, 5, 0xe0b53c),
          this.add.circle(-14, -9, 5, 0xe0b53c),
          this.add.circle(-14, -14, 3, 0x9b7130)
        ]);
      }
      if (playerIndex === 3) {
        head.add([
          this.add.triangle(-6, 22, -12, 0, 0, 7, 0, -7, 0xd9c6a4),
          this.add.triangle(6, 22, 12, 0, 0, 7, 0, -7, 0xd9c6a4)
        ]);
      }
      root.add([body, head]);
      root.chest = body;
      root.head = head;
      return root.setScale(BASE_SCALE);
    }

    function drawRoom() {
      const background = this.add.graphics();
      background.fillStyle(0xf5ead9).fillRect(0, 0, WIDTH, FLOOR_Y + 89);

      for (let y = 104; y < FLOOR_Y; y += 72) {
        background.lineStyle(1, 0xd9c9b4, 0.55).lineBetween(0, y, WIDTH, y);
      }
      for (let x = 12; x < WIDTH; x += 24) {
        background.lineStyle(1, 0xffffff, 0.2).lineBetween(x, 92, x, FLOOR_Y);
      }

      background.lineStyle(4, 0x6f5c75, 0.95).lineBetween(18, START_LINE_Y, WIDTH - 18, START_LINE_Y);
      background.fillStyle(0x6f5c75).fillRect(0, FLOOR_Y, WIDTH, 89);
      const hud = this.add.graphics().setScrollFactor(0).setDepth(10);
      hud.fillStyle(0x413647).fillRect(0, 0, WIDTH, 58);
      this.add.text(18, 17, '찰싹 레이스', {
        fontFamily: 'system-ui, sans-serif', fontSize: '22px', fontStyle: '900', color: '#ffffff'
      }).setScrollFactor(0).setDepth(11);
      this.add.text(WIDTH - 16, 23, 'PROTOTYPE', {
        fontFamily: 'system-ui, sans-serif', fontSize: '11px', color: '#d8cadd'
      }).setOrigin(1, 0).setScrollFactor(0).setDepth(11);
      this.add.text(WIDTH / 2, FLOOR_Y + 21, 'FINISH', {
        fontFamily: 'system-ui, sans-serif', fontSize: '18px', fontStyle: '900', color: '#e8dce9'
      }).setOrigin(0.5);
    }

    console.assert(NAMES.length === 4, '프로토타입은 레이서 4명을 사용합니다.');

    function launchGame() {
      new Phaser.Game({
        type: Phaser.AUTO,
        parent: 'game',
        width: WIDTH,
        height: HEIGHT,
        backgroundColor: '#f5ead9',
        scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
        physics: { default: 'matter', matter: { gravity: { y: 0.48 } } },
        scene: { create, update }
      });
    }
  </script>
</body>
</html>
