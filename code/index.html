<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>찰싹 레이스</title>
  <style>
    :root { color-scheme: light; --ink: #183b32; --forest: #245444; --moss: #89a778; --cream: #fbf5df; --paper: #f3e9c9; --carrot: #df7040; --sun: #f0c667; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #39291f; }
    body { display: grid; place-items: center; font-family: "Cabinet Grotesk", Pretendard, system-ui, sans-serif; background: radial-gradient(ellipse at 50% 15%, #826a4d 0, #39291f 68%); }
    #game { position: relative; width: min(100vw, 430px); height: 100dvh; max-height: 900px; overflow: hidden; border-inline: 7px solid #e4d3a7; background: var(--cream); box-shadow: -14px 0 0 #294d3e, 14px 0 0 #6f4b32, 0 24px 90px #170e09aa; isolation: isolate; }
    #game::after { position: absolute; inset: 0; z-index: 1; pointer-events: none; content: ""; opacity: .2; background-image: radial-gradient(#183b3222 .7px, transparent .7px); background-size: 5px 5px; mix-blend-mode: multiply; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; inset: max(14px, env(safe-area-inset-top)) 14px auto; z-index: 3; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 2px 10px; padding: 11px 12px 11px 17px; border: 1px solid #193d32; border-radius: 5px 14px 5px 14px; pointer-events: none; color: var(--ink); background: #fff8dfeb; box-shadow: 4px 5px 0 #294d3e30; backdrop-filter: blur(8px); font-weight: 800; }
    #hud > span:first-child { font-family: Georgia, "Noto Serif KR", serif; letter-spacing: -.045em; }
    #status { padding: 6px 9px; border-radius: 3px 8px 3px 8px; color: var(--cream); background: var(--forest); font-size: 12px; letter-spacing: .02em; }
    #race-timer { grid-column: 1 / -1; font: 900 22px/1 monospace; letter-spacing: -.05em; text-align: right; }
    #guide { position: absolute; z-index: 3; left: 50%; bottom: max(46px, calc(env(safe-area-inset-bottom) + 24px)); transform: translateX(-50%); width: max-content; max-width: 88%; padding: 14px 20px 16px; border: 1px solid #17392f; border-radius: 4px 14px 4px 14px; color: var(--cream); background: var(--forest); box-shadow: 5px 6px 0 #df7040, 0 14px 30px #183b3238; font: 800 15px/1.35 inherit; cursor: pointer; transition: transform .25s ease, background .25s ease; }
    #guide:active { transform: translateX(-50%) scale(.97); }
    button, input { font: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    button:disabled { opacity: .55; cursor: wait; }
    .player-label { position: absolute; z-index: 3; transform: translate(-50%, -100%) rotate(-1deg); padding: 5px 9px; border: 1px solid #183b3266; border-radius: 3px 8px 3px 8px; color: var(--ink); background: #fff8dfeb; font-family: Georgia, "Noto Serif KR", serif; font-size: 12px; font-weight: 700; white-space: nowrap; box-shadow: 2px 3px 0 #df704033; pointer-events: none; }
    #error { position: absolute; inset: 0; z-index: 6; display: none; place-items: center; padding: 28px; color: var(--cream); background: var(--ink); text-align: center; }
    [hidden] { display: none !important; }
    .overlay { position: absolute; inset: 0; z-index: 5; display: grid; align-items: end; padding: 82px 16px max(18px, env(safe-area-inset-bottom)); overflow: hidden; background: linear-gradient(180deg, #173b3008 8%, #173b30bb 72%, #102820ed); }
    .card { position: relative; width: 100%; padding: 24px 22px 22px; overflow: hidden; border: 1px solid #6e5a3f; border-radius: 5px 24px 8px 18px; color: var(--ink); background: linear-gradient(100deg, #e7d7ab 0 9px, #fffaf0 10px 100%); box-shadow: 5px 7px 0 #d4bd86, 10px 13px 0 #294d3e99, 0 28px 70px #071b1573; }
    .card::before { position: absolute; inset: 10px; border: 1px solid #7c684344; border-radius: 2px 15px 3px 11px; pointer-events: none; content: ""; }
    .card::after { position: absolute; right: 0; bottom: 0; width: 30px; height: 30px; clip-path: polygon(100% 0, 0 100%, 100% 100%); background: #d9c69a; box-shadow: -2px -2px 0 #7c684355; content: ""; }
    .card > * { position: relative; z-index: 1; }
    .story-marquee { margin: -24px -22px 18px; overflow: hidden; border-bottom: 1px solid #593824; color: #fff8df; background: #b85734; font-family: Georgia, "Noto Serif KR", serif; font-size: 11px; font-weight: 700; letter-spacing: .08em; }
    .story-marquee-track { display: flex; width: max-content; padding: 8px 0; }
    .story-marquee-track span { width: max-content; padding-right: 24px; }
    .hero-title { max-width: 22rem; margin: 0 0 10px; font-family: Georgia, "Noto Serif KR", serif; font-size: clamp(28px, 8vw, 37px); line-height: 1.04; letter-spacing: -.065em; text-decoration: underline 3px #df704066; text-underline-offset: 7px; }
    .hero-title span { display: block; }
    .hero-title img { display: inline-block; width: 54px; height: 30px; margin-left: 5px; border-radius: 999px; object-fit: cover; object-position: 50% 28%; vertical-align: middle; filter: saturate(.75) contrast(1.08); }
    .card h2 { max-width: 19rem; margin: 0 0 8px; font-family: Georgia, "Noto Serif KR", serif; font-size: 30px; line-height: 1.06; letter-spacing: -.055em; }
    .card > p { margin: 0 0 18px; color: #4f6b60; line-height: 1.45; }
    .turtle-mark { position: absolute; top: 58px; right: -18px; width: 80px; height: 58px; opacity: .18; transform: rotate(-12deg); }
    .turtle-mark::before { position: absolute; inset: 9px 18px 5px 4px; border: 4px double var(--forest); border-radius: 50%; content: ""; }
    .turtle-mark::after { position: absolute; top: 19px; right: 5px; width: 18px; height: 16px; border-radius: 50%; background: var(--forest); box-shadow: -49px -15px 0 -4px var(--forest), -49px 22px 0 -4px var(--forest), -16px -16px 0 -4px var(--forest), -16px 23px 0 -4px var(--forest); content: ""; }
    .mode-picker { display: flex; gap: 6px; margin-bottom: 12px; }
    .mode-picker button, .secondary { min-width: 0; padding: 11px; border: 1px solid #5f503b; border-radius: 3px 10px 3px 10px; color: var(--ink); background: #fff8e7; box-shadow: 2px 3px 0 #d8c59a; font-weight: 800; transition: flex .45s cubic-bezier(.2,.8,.2,1), transform .25s ease, background .25s ease; }
    .mode-picker button { flex: 1; }
    .mode-picker button[aria-pressed="true"] { flex: 1.45; color: var(--cream); background: var(--forest); }
    #name-fields { display: grid; grid-template-columns: 1fr 1fr; grid-auto-flow: dense; gap: 1px; overflow: hidden; border: 1px solid #5f503b; border-radius: 3px 12px 3px 12px; background: #5f503b; box-shadow: 3px 4px 0 #d8c59a; }
    .participant { min-width: 0; display: grid; background: #fffbd5; }
    #name-fields input, #name-fields select { min-width: 0; width: 100%; border: 0; border-radius: 0; color: var(--ink); background: #fffbd5; outline: none; }
    #name-fields input { padding: 12px 11px 7px; }
    #name-fields select { display: none; }
    .character-trigger { padding: 3px 10px 9px; border: 0; color: #28704a; background: transparent; text-align: left; font-size: 12px; font-weight: 900; }
    .character-trigger::after { float: right; content: "캐릭터 선택"; color: #2489a7; font-size: 10px; }
    .character-trigger:disabled::after { content: ""; }
    #name-fields select option:disabled { color: #aaa; }
    #name-fields input:focus { position: relative; z-index: 1; box-shadow: inset 0 0 0 2px var(--carrot); }
    #game[data-mode="choice"] .character-trigger { display: none; }
    #character-picker { position: absolute; inset: 0; z-index: 10; padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); color: var(--ink); background: #69d7e5f5; backdrop-filter: blur(10px); }
    #character-picker[hidden] { display: none; }
    .character-dialog { height: 100%; display: grid; grid-template-rows: auto auto 1fr auto; gap: 12px; padding: 18px; border: 4px solid var(--forest); border-radius: 28px; background: #fffbd5; box-shadow: 0 8px 0 #1f603c; }
    .character-dialog header { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .character-dialog h2 { margin: 0; font-size: 29px; line-height: 1; letter-spacing: -.05em; }
    .character-dialog p { margin: 0; color: #327056; font-size: 13px; }
    #character-close { padding: 8px 11px; border: 3px solid var(--forest); border-radius: 12px; color: var(--ink); background: #fff3a7; font-weight: 900; }
    #character-stage { position: relative; min-height: 0; overflow: hidden; border-block: 3px solid #8fbd54; perspective: 700px; touch-action: pan-y; }
    #character-track { position: absolute; inset: 0 34px; }
    .character-card { position: absolute; top: 5%; left: 50%; width: 72%; height: 90%; display: grid; place-items: center; align-content: center; gap: 8px; overflow: hidden; border: 4px solid var(--forest); border-radius: 26px; color: var(--ink); background: #dff6d8; box-shadow: 0 7px 0 #1f603c; font-size: 20px; font-weight: 950; opacity: 0; pointer-events: none; transition: transform .45s cubic-bezier(.2,.8,.2,1), opacity .35s ease, filter .35s ease; }
    .character-card img { width: 100%; height: min(39vh, 330px); object-fit: contain; }
    .character-card[data-position="current"] { z-index: 3; opacity: 1; pointer-events: auto; transform: translateX(-50%) scale(1); }
    .character-card[data-position="prev"] { z-index: 2; opacity: .48; pointer-events: auto; filter: saturate(.7); transform: translateX(-118%) scale(.68) rotateY(14deg); }
    .character-card[data-position="next"] { z-index: 2; opacity: .48; pointer-events: auto; filter: saturate(.7); transform: translateX(18%) scale(.68) rotateY(-14deg); }
    .character-card[data-position="hidden"] { transform: translateX(-50%) scale(.45); }
    .carousel-arrow { position: absolute; top: 50%; z-index: 5; width: 44px; height: 58px; transform: translateY(-50%); border: 3px solid var(--forest); border-radius: 15px; color: #fffbd5; background: #f15b2a; box-shadow: 0 4px 0 #a93b1c; font-size: 28px; font-weight: 950; }
    #character-prev { left: 0; }
    #character-next { right: 0; }
    .character-confirm { display: grid; grid-template-columns: 1fr 1.35fr; align-items: center; gap: 9px; }
    #selected-character-name { padding-left: 8px; font-size: 24px; letter-spacing: -.04em; }
    #character-confirm { padding: 13px; border: 3px solid #205d3c; border-radius: 16px; color: #fffbd5; background: #f15b2a; box-shadow: 0 5px 0 #a93b1c; font-weight: 950; }
    #decision-question { display: none; width: 100%; margin-bottom: 9px; padding: 13px 14px; border: 3px solid var(--forest); border-radius: 15px; color: var(--ink); background: #dff6ff; outline: none; box-shadow: 0 4px 0 #1f603c; }
    #game[data-mode="choice"] #decision-question { display: block; }
    #game[data-mode="choice"] .card { background: #eaf9df; }
    #game[data-mode="choice"] .mode-picker button[aria-pressed="true"] { background: #2489a7; }
    #game[data-mode="choice"] #name-fields { border-color: #2489a7; background: #2489a7; box-shadow-color: #17687f; }
    #race-start { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; pointer-events: none; background: #163b2db8; backdrop-filter: blur(2px); }
    #race-start[hidden] { display: none; }
    .start-board { min-width: 230px; padding: 22px 26px 26px; border: 5px solid #fffbd5; border-radius: 28px; background: #22543d; box-shadow: 0 10px 0 #123425, 0 28px 70px #06150f99; text-align: center; }
    .signal-lights { display: flex; justify-content: center; gap: 13px; margin-bottom: 10px; }
    .signal-lights i { width: 38px; height: 38px; border: 4px solid #123425; border-radius: 50%; background: #17372d; box-shadow: inset 0 -5px 0 #0004; }
    .signal-lights i.on { background: #ffd83d; box-shadow: 0 0 24px #ffd83d, inset 0 -5px 0 #d78d13; }
    .signal-lights i.go { background: #72ed6c; box-shadow: 0 0 30px #72ed6c, inset 0 -5px 0 #2b9f42; }
    #start-count { color: #fffbd5; font-size: 86px; font-weight: 950; line-height: .95; text-shadow: 0 7px 0 #10291f; }
    #start-caption { margin-top: 8px; color: #fff3a7; font-size: 14px; font-weight: 850; letter-spacing: .13em; }
    .settings { display: flex; gap: 18px; margin: 14px 2px; color: #4f6b60; font-size: 13px; font-weight: 700; }
    .settings input { accent-color: var(--forest); }
    .primary { width: 100%; padding: 14px; border: 1px solid #17392f; border-radius: 4px 14px 4px 14px; color: var(--cream); background: var(--forest); box-shadow: 4px 5px 0 #df7040; font-weight: 850; transition: transform .25s ease, background .25s ease; }
    .primary:active, .secondary:active, .mode-picker button:active { transform: scale(.97); }
    .feedback-carousel { display: grid; grid-template-columns: 36px 1fr 36px; align-items: center; margin: 14px 0; border-block: 1px dashed #6e5a3f88; }
    .feedback-carousel button { height: 44px; border: 0; color: var(--ink); background: transparent; font-size: 18px; }
    #result-copy { min-height: 58px; margin: 0; padding: 10px 8px; display: grid; place-items: center; color: #4f6b60; text-align: center; line-height: 1.4; }
    #result-list { margin: 14px 0 18px; padding: 0; list-style: none; display: grid; }
    #result-list li { margin-top: -1px; padding: 11px 13px; border: 1px solid #6e5a3f55; background: #fff8df; font-family: Georgia, "Noto Serif KR", serif; font-weight: 700; box-shadow: 2px 3px 0 #d8c59a; }
    #result-list li:nth-child(even) { transform: rotate(.4deg); }
    #result-list li:first-child { position: relative; z-index: 2; color: var(--cream); background: var(--carrot); transform: rotate(-.5deg); }
    .actions { display: grid; grid-template-columns: 1fr 2fr; gap: 8px; }
    :root { --ink: #22543d; --forest: #2d7b4b; --cream: #fffbd5; --paper: #fff3a7; --carrot: #f15b2a; --sun: #ffd83d; }
    html, body { background: #69d7e5; }
    body { font-family: Outfit, "Arial Rounded MT Bold", Pretendard, system-ui, sans-serif; background: #69d7e5; }
    #game { border: 0; background: #8de8ee; box-shadow: 0 0 0 6px #2d7b4b, 8px 0 0 #f15b2a; }
    #game::after { display: none; }
    #hud { border: 3px solid var(--forest); border-radius: 18px; background: #fffbd5; box-shadow: 0 5px 0 #1f603c; backdrop-filter: none; }
    #hud > span:first-child { font-family: inherit; letter-spacing: -.03em; }
    #status { border-radius: 12px; background: var(--carrot); }
    #guide { border: 3px solid #205d3c; border-radius: 18px; background: var(--carrot); box-shadow: 0 6px 0 #a93b1c; }
    .player-label { border: 2px solid var(--forest); border-radius: 12px; background: #fffbd5; box-shadow: 0 3px 0 #1f603c55; font-family: inherit; }
    .overlay { background: linear-gradient(#63dce733, #4d9d52aa); }
    .card { padding: 22px; border: 4px solid var(--forest); border-radius: 26px; background: #fffbd5; box-shadow: 0 8px 0 #1f603c, 0 18px 30px #18502d44; }
    .card::before, .card::after { display: none; }
    .story-marquee { margin: -22px -22px 18px; border-bottom: 3px solid #a93b1c; background: var(--carrot); font-family: inherit; letter-spacing: .05em; }
    .hero-title, .card h2 { font-family: inherit; line-height: 1; text-decoration: none; }
    .hero-title img { border: 3px solid var(--forest); background: #8de8ee; filter: saturate(1.1); }
    .turtle-mark { opacity: .24; }
    .mode-picker button, .secondary { border: 3px solid var(--forest); border-radius: 15px; background: #fff3a7; box-shadow: 0 4px 0 #1f603c; }
    .mode-picker button[aria-pressed="true"] { color: #fffbd5; background: var(--forest); }
    #name-fields { gap: 3px; border: 3px solid var(--forest); border-radius: 17px; background: var(--forest); box-shadow: 0 4px 0 #1f603c; }
    #name-fields input { background: #fffbd5; }
    .settings { color: var(--ink); }
    .primary { border: 3px solid #205d3c; border-radius: 16px; background: var(--carrot); box-shadow: 0 5px 0 #a93b1c; }
    .feedback-carousel { border-block: 3px solid #8fbd54; }
    #result-list li { border: 3px solid var(--forest); background: #fff3a7; box-shadow: 0 3px 0 #1f603c; font-family: inherit; }
    #result-list li:first-child { background: var(--carrot); }
    @media (hover: hover) { button:hover { transform: translateY(-2px); } .mode-picker button:hover { background: #f8efcf; } .mode-picker button[aria-pressed="true"]:hover { background: #193d32; } }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
  </style>
</head>
<body>
  <main id="game" aria-label="찰싹 레이스 게임">
    <div id="hud"><span>토끼와 거북이의 찰싹 레이스</span><span id="status">준비</span><span id="race-timer">00:00.00</span></div>
    <button id="guide" type="button">캐릭터를 드래그해 배치한 뒤 시작</button>
    <div id="race-start" aria-live="assertive" hidden><div class="start-board"><div class="signal-lights" aria-hidden="true"><i></i><i></i><i></i></div><div id="start-count">3</div><div id="start-caption">출발 준비</div></div></div>
    <div id="error">게임을 불러오지 못했어요.<br />화면을 새로고침해 주세요.</div>
    <section id="setup" class="overlay" aria-labelledby="setup-title">
      <form id="setup-form" class="card">
        <div class="story-marquee" aria-hidden="true"><div class="story-marquee-track"><span>천천히 가도 먼저 닿으면 우승</span><span>서두르지 않아도 레이스는 계속된다</span><span>천천히 가도 먼저 닿으면 우승</span><span>서두르지 않아도 레이스는 계속된다</span></div></div>
        <div class="turtle-mark" aria-hidden="true"></div>
        <h1 id="setup-title" class="hero-title"><span>느려도 괜찮아</span><span>먼저 닿으면 우승 <img src="./assets/characters/rabbit.png" alt="" /></span></h1>
        <p id="setup-description">이름을 적고 벽에 붙여주세요. 이번 이야기의 결말은 중력이 정합니다.</p>
        <div class="mode-picker" aria-label="게임 모드">
          <button type="button" data-mode="friends" aria-pressed="true">친구 내기</button>
          <button type="button" data-mode="choice" aria-pressed="false">혼자 결정</button>
        </div>
        <input id="decision-question" maxlength="30" placeholder="무엇을 결정할까요?" aria-label="결정할 질문" />
        <div id="name-fields">
          <div class="participant"><input name="name" maxlength="10" placeholder="첫 번째 이름" aria-label="첫 번째 참가자" required /><select name="character" aria-label="첫 번째 캐릭터"></select><button class="character-trigger" type="button">곰</button></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="두 번째 이름" aria-label="두 번째 참가자" required /><select name="character" aria-label="두 번째 캐릭터"></select><button class="character-trigger" type="button">토끼</button></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="세 번째 이름 (선택)" aria-label="세 번째 참가자" /><select name="character" aria-label="세 번째 캐릭터"></select><button class="character-trigger" type="button">고양이</button></div>
          <div class="participant"><input name="name" maxlength="10" placeholder="네 번째 이름 (선택)" aria-label="네 번째 참가자" /><select name="character" aria-label="네 번째 캐릭터"></select><button class="character-trigger" type="button">오리</button></div>
        </div>
        <div class="settings">
          <label><input id="sound-toggle" type="checkbox" checked /> 소리</label>
          <label><input id="haptic-toggle" type="checkbox" checked /> 진동</label>
        </div>
        <button id="setup-submit" class="primary" type="submit" disabled>게임 준비 중</button>
      </form>
    </section>
    <section id="character-picker" role="dialog" aria-modal="true" aria-labelledby="character-title" hidden>
      <div class="character-dialog">
        <header><h2 id="character-title">함께 달릴 친구</h2><button id="character-close" type="button">닫기</button></header>
        <p>좌우로 넘겨 한 친구를 고른 뒤 확정해주세요.</p>
        <div id="character-stage"><button id="character-prev" class="carousel-arrow" type="button" aria-label="이전 캐릭터">‹</button><div id="character-track"></div><button id="character-next" class="carousel-arrow" type="button" aria-label="다음 캐릭터">›</button></div>
        <div class="character-confirm"><strong id="selected-character-name"></strong><button id="character-confirm" type="button">이 친구로 결정</button></div>
      </div>
    </section>
    <section id="result" class="overlay" aria-labelledby="result-title" hidden>
      <div class="card">
        <div class="story-marquee" aria-hidden="true"><div class="story-marquee-track"><span>이번 우화의 결말</span><span>빠름보다 중요한 건 끝까지 내려가는 것</span><span>이번 우화의 결말</span><span>빠름보다 중요한 건 끝까지 내려가는 것</span></div></div>
        <h2 id="result-title"></h2>
        <div class="feedback-carousel"><button id="comment-prev" type="button" aria-label="이전 한마디">←</button><p id="result-copy" aria-live="polite"></p><button id="comment-next" type="button" aria-label="다음 한마디">→</button></div>
        <ol id="result-list"></ol>
        <div class="actions">
          <button id="edit-players" class="secondary" type="button">이름 변경</button>
          <button id="replay" class="primary" type="button">한 판 더</button>
        </div>
      </div>
    </section>
  </main>
  <script type="module" src="./game.js"></script>
</body>
</html>
